name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify dist is committed and current
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all dist)" ]; then
            echo "dist/ is missing or out of date. Run 'pnpm build' and commit the result."
            git status --short dist
            exit 1
          fi
      - name: Build and smoke-test the command line tool
        run: |
          pnpm build:cli
          node dist-cli/index.js --no-external-links
